<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Study Lamp — Sign in</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    .login-wrap { min-height: 100vh; display: grid; place-items: center; }
    .login-card { width: min(360px, 90vw); display: grid; gap: 1rem; padding: 2rem;
      border: 1px solid var(--border, #ddd); border-radius: 12px; }
    .login-card h1 { margin: 0; font-size: 1.25rem; }
    .login-card input { padding: .6rem .7rem; font-size: 1rem; }
    .login-card button { padding: .6rem .7rem; font-size: 1rem; cursor: pointer; }
    .login-error { color: #c0392b; font-size: .9rem; display: none; }
  </style>
</head>
<body>
  <main class="login-wrap">
    <form class="login-card" method="post" action="/login">
      <h1>Study Lamp</h1>
      <p class="login-error" id="loginError">Wrong password. Try again.</p>
      <input type="password" name="password" placeholder="Password"
             aria-label="Password" autofocus required />
      <button type="submit">Sign in</button>
    </form>
  </main>
  <script>
    if (new URLSearchParams(location.search).has("error")) {
      document.getElementById("loginError").style.display = "block";
    }
  </script>
</body>
</html>
